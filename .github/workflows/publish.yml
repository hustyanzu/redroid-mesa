name: Publish to GHCR

on:
  push:
    tags:
      - "v*"
      - "a13*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VARIANT: a13

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: sudo bash scripts/install-deps.sh

      - name: Cache NDK + Mesa sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/ndk
            third_party/mesa
          key: tp-${{ runner.os }}-${{ hashFiles('variants/a13/variant.env', 'patches/**', 'scripts/**') }}

      - name: Build Mesa + local image
        env:
          SKIP_DEPS: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Load metadata
        id: meta
        run: |
          set -a
          # shellcheck disable=SC1091
          source variants/a13/variant.env
          set +a
          ver="${MESA_TAG#mesa-}"
          echo "mesa_version=$ver" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME:-redroid-mesa}" >> "$GITHUB_OUTPUT"
          echo "local_tag=a13-${ver}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.meta.outputs.image_name }}
          MESA: ${{ steps.meta.outputs.mesa_version }}
          LOCAL: ${{ steps.meta.outputs.local_tag }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          remote="${REGISTRY}/${owner_lc}/${NAME}"

          docker tag "${NAME}:${LOCAL}" "${remote}:${LOCAL}"
          docker tag "${NAME}:${LOCAL}" "${remote}:a13"
          docker tag "${NAME}:${LOCAL}" "${remote}:latest"
          docker push "${remote}:${LOCAL}"
          docker push "${remote}:a13"
          docker push "${remote}:latest"

          if [ "$EVENT" = "push" ]; then
            docker tag "${NAME}:${LOCAL}" "${remote}:${REF}"
            docker push "${remote}:${REF}"
          fi

          echo "Pushed ${remote}:{${LOCAL},a13,latest}"
