name: Publish to GHCR

# CI runs in Fedora 44 so packages match the primary build host.
# Users install deps themselves (README); this job uses scripts/ci/install-packages.sh only.
#
# GHCR publishes every variant under variants/ (houdini is implied in combo tags).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --privileged
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: bash scripts/ci/free-disk.sh

      - name: Install Fedora build packages
        run: bash scripts/ci/install-packages.sh

      - name: Cache NDK + Mesa + downloads
        uses: actions/cache@v4
        with:
          path: |
            third_party/ndk
            third_party/mesa
            third_party/downloads
          key: tp-fedora-${{ hashFiles('variants/**/variant.env', 'patches/**', 'scripts/**') }}

      - name: Load metadata
        id: meta
        run: |
          set -a
          # shellcheck disable=SC1091
          source variants/a13/variant.env
          set +a
          ver="${MESA_TAG#mesa-}"
          echo "mesa_version=$ver" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME:-redroid-mesa}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mesa once
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
          TMPDIR: ${{ github.workspace }}/.ci-tmp
        run: |
          chmod +x scripts/*.sh scripts/ci/*.sh
          mkdir -p "$TMPDIR"
          ./scripts/build.sh --mesa-only
          df -h

      - name: Build, push, prune each variant
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.meta.outputs.image_name }}
          VER: ${{ steps.meta.outputs.mesa_version }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
          TMPDIR: ${{ github.workspace }}/.ci-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          remote="${REGISTRY}/${owner_lc}/${NAME}"
          variants=(
            a13
            a13-houdini
            a13-supersu
            a13-mindthegapps
            a13-mindthegapps-supersu
            a13-magisk
            a13-mindthegapps-magisk
          )

          for v in "${variants[@]}"; do
            echo "==== variant $v ===="
            df -h
            SKIP_MESA_BUILD=1 ./scripts/build.sh "$v"

            local_tag="${v}-${VER}"
            docker tag "${NAME}:${local_tag}" "${remote}:${local_tag}"
            docker tag "${NAME}:${local_tag}" "${remote}:${v}"
            docker push "${remote}:${local_tag}"
            docker push "${remote}:${v}"

            if [ "$v" = "a13" ]; then
              docker tag "${NAME}:${local_tag}" "${remote}:latest"
              docker push "${remote}:latest"
              if [ "$EVENT" = "push" ]; then
                docker tag "${NAME}:${local_tag}" "${remote}:${REF}"
                docker push "${remote}:${REF}"
              fi
            fi

            # Drop just-built tags so images do not pile up on the runner.
            docker rmi -f \
              "${NAME}:${local_tag}" \
              "${NAME}:${v}" \
              "${remote}:${local_tag}" \
              "${remote}:${v}" \
              "${remote}:latest" \
              "${remote}:${REF}" \
              2>/dev/null || true
            docker system prune -f 2>/dev/null || true
            rm -rf out/docker-context out/extras "${TMPDIR:?}/"* 2>/dev/null || true
            df -h
          done

          echo "Pushed ${remote} variants: ${variants[*]} (+ latest)"
