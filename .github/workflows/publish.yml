name: Publish to GHCR

# CI runs in Fedora 44 so packages match the primary build host.
# Users install deps themselves (README); this job uses scripts/ci/install-packages.sh only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --privileged
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fedora build packages
        run: bash scripts/ci/install-packages.sh

      - name: Cache NDK + Mesa + downloads
        uses: actions/cache@v4
        with:
          path: |
            third_party/ndk
            third_party/mesa
            third_party/downloads
          key: tp-fedora-${{ hashFiles('variants/**/variant.env', 'patches/**', 'scripts/**') }}

      - name: Build Mesa + all variant images
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          chmod +x scripts/*.sh scripts/ci/*.sh
          ./scripts/build.sh --all

      - name: Load metadata
        id: meta
        run: |
          set -a
          # shellcheck disable=SC1091
          source variants/a13/variant.env
          set +a
          ver="${MESA_TAG#mesa-}"
          echo "mesa_version=$ver" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME:-redroid-mesa}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push all variants
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.meta.outputs.image_name }}
          VER: ${{ steps.meta.outputs.mesa_version }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          remote="${REGISTRY}/${owner_lc}/${NAME}"
          variants=(
            a13
            a13-houdini
            a13-microg
            a13-mindthegapps
            a13-magiskdelta
            a13-magisk
            a13-microg-magiskdelta
            a13-microg-magisk
            a13-mindthegapps-magiskdelta
            a13-mindthegapps-magisk
          )

          for v in "${variants[@]}"; do
            local_tag="${v}-${VER}"
            docker tag "${NAME}:${local_tag}" "${remote}:${local_tag}"
            docker tag "${NAME}:${local_tag}" "${remote}:${v}"
            docker push "${remote}:${local_tag}"
            docker push "${remote}:${v}"
          done

          # latest = full stack (mesa + houdini + microG + Kitsune)
          docker tag "${NAME}:a13-microg-magiskdelta-${VER}" "${remote}:latest"
          docker push "${remote}:latest"

          if [ "$EVENT" = "push" ]; then
            docker tag "${NAME}:a13-microg-magiskdelta-${VER}" "${remote}:${REF}"
            docker push "${remote}:${REF}"
          fi

          echo "Pushed ${remote} variants: ${variants[*]} (+ latest)"
